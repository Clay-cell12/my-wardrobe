<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardrobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F6F6F8;
    --surface: #FFFFFF;
    --surface-2: #F0F0F4;
    --text: #17171C;
    --text-dim: #75757F;
    --accent: #5B4FE9;
    --accent-dim: #EEEBFF;
    --accent-press: #4A3FD1;
    --good: #16A085;
    --good-bg: #E7F8F3;
    --warn: #E8590C;
    --warn-bg: #FDEFE6;
    --border: rgba(23,23,28,0.08);
    --shadow: 0 1px 2px rgba(23,23,28,0.04), 0 8px 24px rgba(23,23,28,0.06);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 40px;}
  header{padding:4px 0 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .brand{font-family:'Manrope',sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:-0.02em;margin:0;color:var(--text);}
  .tagline{font-family:'Inter',sans-serif;font-weight:500;color:var(--text-dim);margin:2px 0 0;font-size:0.9rem;}
  .signout{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);border-radius:999px;font-size:0.78rem;font-weight:600;padding:8px 14px;cursor:pointer;margin-top:2px;white-space:nowrap;}

  .card{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:1.05rem;margin:0 0 16px;letter-spacing:-0.01em;}
  label{display:block;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:8px;}
  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}

  .temp-row{display:flex;align-items:center;gap:12px;}
  input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg, var(--accent-dim), var(--accent));outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 2px 6px rgba(23,23,28,0.2);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);cursor:pointer;}
  .temp-readout{font-family:'Manrope',sans-serif;font-weight:800;font-size:1.1rem;min-width:56px;text-align:right;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-family:'Inter',sans-serif;font-weight:600;font-size:0.85rem;padding:8px 15px;border-radius:999px;border:1px solid transparent;background:var(--surface-2);color:var(--text-dim);cursor:pointer;transition:all .15s;}
  .chip.active{background:var(--accent);color:#fff;}

  textarea, input[type=text], input[type=email], input[type=password]{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;color:var(--text);font-family:'Inter',sans-serif;font-size:0.9rem;padding:12px 14px;resize:none;}
  textarea:focus, input:focus, select:focus, button:focus-visible{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-dim);}

  .btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:999px;font-family:'Inter',sans-serif;font-weight:700;font-size:0.95rem;padding:14px;cursor:pointer;margin-top:18px;transition:background .15s;}
  .btn-primary:active{background:var(--accent-press);}
  .btn-primary:disabled{opacity:0.45;cursor:default;}

  #result-card{display:none;}
  .result-reasoning{font-size:0.92rem;line-height:1.6;color:var(--text);margin-bottom:16px;}
  .flatlay{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .flatlay-item{background:var(--surface-2);border-radius:16px;overflow:hidden;}
  .flatlay-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
  .flatlay-item .cap{font-family:'Inter',sans-serif;font-weight:700;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);padding:6px 8px;}
  .gaps-note{margin-top:16px;font-size:0.82rem;color:var(--warn);line-height:1.6;background:var(--warn-bg);padding:12px 14px;border-radius:14px;}

  .rail-section{margin-bottom:24px;}
  .rail-section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:0.95rem;letter-spacing:-0.01em;margin:0 0 12px 2px;}
  .rail-scroll{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;}
  .garment{flex:0 0 auto;width:104px;display:flex;flex-direction:column;align-items:center;position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:10px 8px 12px;box-shadow:var(--shadow);}
  .garment-thumb{width:88px;height:88px;border-radius:12px;overflow:hidden;background:var(--surface-2);}
  .garment-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .garment-name{font-size:0.75rem;font-weight:600;color:var(--text);margin-top:8px;text-align:center;line-height:1.25;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .garment-remove{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:rgba(23,23,28,0.55);border:none;color:#fff;font-size:0.65rem;line-height:20px;text-align:center;cursor:pointer;padding:0;}
  .garment-add{flex:0 0 auto;width:104px;height:132px;border-radius:18px;border:1.5px dashed var(--border);background:transparent;color:var(--accent);font-size:1.8rem;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .empty-row{font-size:0.85rem;color:var(--text-dim);padding:18px;background:var(--surface);border:1px dashed var(--border);border-radius:16px;}
  .empty-row button{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-weight:700;font-size:0.85rem;cursor:pointer;padding:0;}
  .session-note{font-size:0.75rem;color:var(--text-dim);text-align:center;margin-top:24px;line-height:1.6;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(23,23,28,0.4);z-index:50;align-items:flex-end;justify-content:center;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px 28px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;}
  .modal h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:1.1rem;margin:0 0 18px;letter-spacing:-0.01em;}
  select{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;color:var(--text);font-family:'Inter',sans-serif;font-weight:500;font-size:0.9rem;padding:12px 14px;}
  .file-drop{border:1.5px dashed var(--border);border-radius:16px;padding:20px;text-align:center;color:var(--text-dim);font-weight:600;font-size:0.85rem;cursor:pointer;position:relative;overflow:hidden;}
  .file-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .file-preview{width:100%;max-height:160px;object-fit:contain;border-radius:12px;margin-top:12px;display:none;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .stars{display:flex;gap:2px;margin-top:8px;}
  .star{cursor:pointer;color:var(--border);font-size:0.9rem;line-height:1;background:none;border:none;padding:0;}
  .star.filled{color:var(--accent);}

  .garment.dirty{opacity:0.55;}
  .garment.dirty .garment-thumb img{filter:grayscale(70%);}
  .garment-dirty-badge{font-family:'Inter',sans-serif;font-weight:700;font-size:0.55rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:999px;margin-top:6px;}
  .garment-meta{font-size:0.68rem;color:var(--text-dim);text-align:center;margin-top:2px;}
  .garment-wash-btn{background:var(--surface-2);border:none;color:var(--text-dim);border-radius:999px;font-size:0.62rem;font-weight:700;padding:4px 10px;margin-top:6px;cursor:pointer;}

  .confidence{display:inline-block;font-family:'Manrope',sans-serif;font-weight:800;font-size:0.75rem;padding:5px 12px;border-radius:999px;margin-bottom:12px;}
  .confidence.high{color:var(--good);background:var(--good-bg);}
  .confidence.mid{color:var(--accent);background:var(--accent-dim);}
  .confidence.low{color:var(--warn);background:var(--warn-bg);}
  .wear-btn{margin-top:16px;}
  .btn-secondary{flex:1;background:var(--surface-2);border:none;color:var(--text);border-radius:999px;padding:13px;font-family:'Inter',sans-serif;font-weight:700;cursor:pointer;}
  .modal-actions .btn-primary{margin-top:0;flex:1.4;}

  #auth-screen{max-width:400px;margin:64px auto 0;padding:0 16px;}
  #auth-screen .card{margin-bottom:0;}
  .auth-toggle{text-align:center;margin-top:16px;font-size:0.85rem;color:var(--text-dim);}
  .auth-toggle button{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:0.85rem;padding:0;}
  .auth-error{color:var(--warn);font-size:0.82rem;margin-top:12px;min-height:1em;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="auth-screen">
  <header style="display:block;text-align:center;">
    <p class="brand">Wardrobe</p>
    <p class="tagline">Tell me what's going on out there.</p>
  </header>
  <div class="card">
    <h2 id="auth-title">Sign in</h2>
    <div class="field">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" autocomplete="email">
    </div>
    <div class="field">
      <label for="auth-password">Password</label>
      <input type="password" id="auth-password" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="auth-submit">Sign in</button>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-toggle">
      <span id="auth-toggle-text">New here?</span> <button id="auth-toggle-btn">Create an account</button>
    </div>
  </div>
</div>

<div class="wrap hidden" id="app-screen">

  <header>
    <div>
      <p class="brand">Wardrobe</p>
      <p class="tagline">Tell me what's going on out there.</p>
    </div>
    <button class="signout" id="signout-btn">Sign out</button>
  </header>

  <div class="card">
    <h2>Today</h2>
    <div class="field">
      <label for="temp">Temperature</label>
      <div class="temp-row">
        <input type="range" id="temp" min="-10" max="105" value="62">
        <span class="temp-readout" id="temp-readout">62°F</span>
      </div>
    </div>
    <div class="field">
      <label>Conditions</label>
      <div class="chips" id="condition-chips"></div>
    </div>
    <div class="field">
      <label>Occasion</label>
      <div class="chips" id="occasion-chips"></div>
    </div>
    <div class="field">
      <label for="freetext">Or just tell me what's happening (optional)</label>
      <textarea id="freetext" rows="2" placeholder="e.g. rainy interview downtown this afternoon"></textarea>
    </div>
    <button class="btn-primary" id="suggest-btn">What should I wear?</button>
  </div>

  <div class="card" id="result-card">
    <h2>The pick</h2>
    <div class="confidence" id="result-confidence"></div>
    <p class="result-reasoning" id="result-reasoning"></p>
    <div class="flatlay" id="result-flatlay"></div>
    <div class="gaps-note" id="result-gaps"></div>
    <button class="btn-primary wear-btn" id="wore-this-btn">I wore this</button>
  </div>

  <div id="rails"></div>

  <p class="session-note" id="loading-note">Loading your wardrobe…</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add a piece</h2>
    <div class="field">
      <label>Photo</label>
      <div class="file-drop" id="file-drop">
        <span id="file-drop-label">Tap to choose a photo</span>
        <input type="file" accept="image/*" id="photo-input">
      </div>
      <img class="file-preview" id="file-preview">
    </div>
    <div class="field">
      <label for="item-name">Name</label>
      <input type="text" id="item-name" placeholder="e.g. grey wool sweater">
    </div>
    <div class="field">
      <label for="item-category">Category</label>
      <select id="item-category">
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
        <option value="outerwear">Outerwear</option>
        <option value="shoes">Shoes</option>
        <option value="accessory">Accessory</option>
      </select>
    </div>
    <div class="field">
      <label for="item-warmth">Warmth</label>
      <select id="item-warmth">
        <option value="light">Light</option>
        <option value="medium" selected>Medium</option>
        <option value="heavy">Heavy</option>
      </select>
    </div>
    <div class="field">
      <label for="item-formality">Dress code</label>
      <select id="item-formality">
        <option value="casual" selected>Casual</option>
        <option value="smart">Smart-casual</option>
        <option value="business">Business</option>
        <option value="formal">Formal</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="item-brand">Brand (optional)</label>
        <input type="text" id="item-brand" placeholder="e.g. Uniqlo">
      </div>
      <div class="field">
        <label for="item-size">Size (optional)</label>
        <input type="text" id="item-size" placeholder="e.g. M">
      </div>
    </div>
    <div class="field">
      <label for="item-fit">How it actually fits</label>
      <select id="item-fit">
        <option value="runs_small">Runs small / tight</option>
        <option value="true_to_size" selected>True to size</option>
        <option value="runs_large">Runs large / loose</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-save">Add to wardrobe</button>
    </div>
  </div>
</div>

<script>
// =====================================================================
// STEP 1 OF SETUP: paste your Supabase project values here.
// Find them in Supabase: Project Settings -> API
// =====================================================================
const SUPABASE_URL = 'https://mqxplcwvqyfteosyfrit.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_J052GcFvwLHIvM_MXIw78g_vdsumt3i';
// =====================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = 'wardrobe-photos';

const CATEGORIES = [
  {key:'top', label:'Tops'},
  {key:'bottom', label:'Bottoms'},
  {key:'outerwear', label:'Outerwear'},
  {key:'shoes', label:'Shoes'},
  {key:'accessory', label:'Accessories'}
];
const WARMTH_SCALE = {light:0, medium:1, heavy:2};
const FORMALITY_SCALE = {casual:0, smart:1, business:2, formal:3};
const CONDITIONS = ['Clear','Cloudy','Rain','Snow','Windy'];
const OCCASIONS = ['Casual','Work','Formal','Workout','Date night'];

let wardrobe = [];
let selectedCondition = 'Clear';
let selectedOccasion = 'Casual';
let pendingPhoto = null;
let currentUser = null;

// ---------------- AUTH ----------------
let authMode = 'signin';
const authTitle = document.getElementById('auth-title');
const authSubmit = document.getElementById('auth-submit');
const authToggleText = document.getElementById('auth-toggle-text');
const authToggleBtn = document.getElementById('auth-toggle-btn');
const authError = document.getElementById('auth-error');

authToggleBtn.addEventListener('click', ()=>{
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  authTitle.textContent = authMode === 'signin' ? 'Sign in' : 'Create your account';
  authSubmit.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  authToggleText.textContent = authMode === 'signin' ? 'New here?' : 'Already have an account?';
  authToggleBtn.textContent = authMode === 'signin' ? 'Create an account' : 'Sign in';
  authError.textContent = '';
});

authSubmit.addEventListener('click', async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  authError.textContent = '';
  if(!email || !password){ authError.textContent = 'Enter an email and password.'; return; }
  authSubmit.disabled = true;
  const fn = authMode === 'signin' ? sb.auth.signInWithPassword : sb.auth.signUp;
  const { data, error } = await fn.call(sb.auth, { email, password });
  authSubmit.disabled = false;
  if(error){ authError.textContent = error.message; return; }
  if(authMode === 'signup' && !data.session){
    authError.textContent = 'Account created — check your email to confirm, then sign in.';
  }
});

document.getElementById('signout-btn').addEventListener('click', ()=> sb.auth.signOut());

sb.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    currentUser = session.user;
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    loadWardrobe();
  } else {
    currentUser = null;
    wardrobe = [];
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('auth-screen').classList.remove('hidden');
  }
});

// ---------------- header chips ----------------
function buildChips(container, options, selectedGetter, selectedSetter){
  container.innerHTML = '';
  options.forEach(opt=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (selectedGetter()===opt ? ' active' : '');
    chip.textContent = opt;
    chip.type = 'button';
    chip.addEventListener('click', ()=>{
      selectedSetter(opt);
      buildChips(container, options, selectedGetter, selectedSetter);
    });
    container.appendChild(chip);
  });
}
buildChips(document.getElementById('condition-chips'), CONDITIONS, ()=>selectedCondition, v=>selectedCondition=v);
buildChips(document.getElementById('occasion-chips'), OCCASIONS, ()=>selectedOccasion, v=>selectedOccasion=v);

const tempSlider = document.getElementById('temp');
const tempReadout = document.getElementById('temp-readout');
tempSlider.addEventListener('input', ()=>{ tempReadout.textContent = tempSlider.value + '°F'; });

function parseFreeText(text){
  const t = text.toLowerCase();
  const tempWords = [
    [['freezing','frigid','arctic'], 15],[['cold','chilly','brisk'], 38],[['cool'], 55],
    [['mild'], 65],[['warm'], 78],[['hot','scorching','sweltering'], 92]
  ];
  for(const [words,val] of tempWords){
    if(words.some(w=>t.includes(w))){ tempSlider.value = val; tempReadout.textContent = val+'°F'; break; }
  }
  const condWords = {
    Rain:['rain','rainy','drizzle','downpour'], Snow:['snow','snowy','blizzard'], Windy:['wind','windy','gusty'],
    Cloudy:['cloud','overcast','grey sky','gray sky'], Clear:['sun','sunny','clear']
  };
  for(const [cond, words] of Object.entries(condWords)){
    if(words.some(w=>t.includes(w))){ selectedCondition = cond; break; }
  }
  const occWords = {
    Formal:['wedding','gala','formal','black tie'], Work:['interview','work','office','meeting','client'],
    Workout:['gym','workout','run','hike','training'], 'Date night':['date']
  };
  for(const [occ, words] of Object.entries(occWords)){
    if(words.some(w=>t.includes(w))){ selectedOccasion = occ; break; }
  }
  buildChips(document.getElementById('condition-chips'), CONDITIONS, ()=>selectedCondition, v=>selectedCondition=v);
  buildChips(document.getElementById('occasion-chips'), OCCASIONS, ()=>selectedOccasion, v=>selectedOccasion=v);
}

// ---------------- data layer (Supabase) ----------------
function rowToItem(row){
  return {
    id: row.id, name: row.name, category: row.category, warmth: row.warmth,
    formality: row.formality, dataUrl: row.image_url,
    brand: row.brand || '', size: row.size || '', fit: row.fit || 'true_to_size',
    rating: row.rating || 0, wearCount: row.wear_count || 0, isDirty: !!row.is_dirty
  };
}

async function loadWardrobe(){
  document.getElementById('loading-note').textContent = 'Loading your wardrobe…';
  const { data, error } = await sb.from('wardrobe_items').select('*').order('created_at', {ascending:true});
  if(error){ document.getElementById('loading-note').textContent = 'Could not load your wardrobe: ' + error.message; return; }
  wardrobe = data.map(rowToItem);
  document.getElementById('loading-note').textContent = 'Signed in as ' + currentUser.email;
  renderRails();
}

async function addWardrobeItem({file, name, category, warmth, formality, brand, size, fit}){
  const path = `${currentUser.id}/${Date.now()}_${file.name}`;
  const { error: uploadError } = await sb.storage.from(BUCKET).upload(path, file);
  if(uploadError) throw uploadError;
  const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
  const { data, error } = await sb.from('wardrobe_items').insert({
    user_id: currentUser.id, name, category, warmth, formality,
    image_url: urlData.publicUrl, image_path: path,
    brand: brand || null, size: size || null, fit: fit || 'true_to_size',
    rating: 0, wear_count: 0, is_dirty: false
  }).select().single();
  if(error) throw error;
  return rowToItem(data);
}

async function removeWardrobeItem(item){
  await sb.from('wardrobe_items').delete().eq('id', item.id);
}

async function setRating(item, rating){
  item.rating = rating;
  renderRails();
  await sb.from('wardrobe_items').update({ rating }).eq('id', item.id);
}

async function toggleDirty(item){
  item.isDirty = !item.isDirty;
  renderRails();
  await sb.from('wardrobe_items').update({ is_dirty: item.isDirty }).eq('id', item.id);
}

async function logWear(items){
  const now = new Date().toISOString();
  for(const item of items){
    item.wearCount = (item.wearCount || 0) + 1;
    item.isDirty = true;
  }
  renderRails();
  for(const item of items){
    await sb.from('wardrobe_items').update({
      wear_count: item.wearCount, is_dirty: true, last_worn: now
    }).eq('id', item.id);
  }
}

// ---------------- wardrobe rails ----------------
function renderRails(){
  const rails = document.getElementById('rails');
  rails.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const items = wardrobe.filter(i=>i.category===cat.key);
    const section = document.createElement('div');
    section.className = 'rail-section';
    const title = document.createElement('div');
    title.className = 'rail-section-title';
    title.textContent = cat.label;
    section.appendChild(title);

    if(items.length===0){
      const empty = document.createElement('div');
      empty.className = 'empty-row';
      empty.innerHTML = `No ${cat.label.toLowerCase()} yet — <button data-cat="${cat.key}">add your first piece</button>.`;
      empty.querySelector('button').addEventListener('click', ()=>openModal(cat.key));
      section.appendChild(empty);
    } else {
      const scroll = document.createElement('div');
      scroll.className = 'rail-scroll';
      items.forEach(item=>{
        const g = document.createElement('div');
        g.className = 'garment' + (item.isDirty ? ' dirty' : '');
        const metaBits = [item.brand, item.size].filter(Boolean).join(' · ');
        const stars = [1,2,3,4,5].map(n=>`<button class="star ${n<=item.rating?'filled':''}" data-n="${n}">★</button>`).join('');
        g.innerHTML = `
          <button class="garment-remove" data-id="${item.id}" aria-label="Remove ${item.name}">✕</button>
          <div class="garment-thumb"><img src="${item.dataUrl}" alt="${item.name}"></div>
          <div class="garment-name">${item.name}</div>
          ${metaBits ? `<div class="garment-meta">${metaBits}</div>` : ''}
          <div class="stars">${stars}</div>
          <div class="garment-meta">Worn ${item.wearCount || 0}×</div>
          ${item.isDirty ? '<div class="garment-dirty-badge">In wash</div>' : ''}
          <button class="garment-wash-btn">${item.isDirty ? 'Mark clean' : 'Mark dirty'}</button>
        `;
        g.querySelector('.garment-remove').addEventListener('click', async ()=>{
          await removeWardrobeItem(item);
          wardrobe = wardrobe.filter(w=>w.id!==item.id);
          renderRails();
        });
        g.querySelectorAll('.star').forEach(starBtn=>{
          starBtn.addEventListener('click', ()=>{
            const n = parseInt(starBtn.dataset.n, 10);
            setRating(item, item.rating === n ? 0 : n);
          });
        });
        g.querySelector('.garment-wash-btn').addEventListener('click', ()=> toggleDirty(item));
        scroll.appendChild(g);
      });
      const addTile = document.createElement('button');
      addTile.className = 'garment-add';
      addTile.textContent = '+';
      addTile.addEventListener('click', ()=>openModal(cat.key));
      scroll.appendChild(addTile);
      section.appendChild(scroll);
    }
    rails.appendChild(section);
  });
}

// ---------------- modal ----------------
const overlay = document.getElementById('overlay');
const photoInput = document.getElementById('photo-input');
const filePreview = document.getElementById('file-preview');
const fileDropLabel = document.getElementById('file-drop-label');

function openModal(defaultCategory){
  document.getElementById('item-category').value = defaultCategory || 'top';
  document.getElementById('item-name').value = '';
  document.getElementById('item-warmth').value = 'medium';
  document.getElementById('item-formality').value = 'casual';
  document.getElementById('item-brand').value = '';
  document.getElementById('item-size').value = '';
  document.getElementById('item-fit').value = 'true_to_size';
  filePreview.style.display = 'none';
  fileDropLabel.textContent = 'Tap to choose a photo';
  pendingPhoto = null;
  photoInput.value = '';
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); }
document.getElementById('modal-cancel').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

photoInput.addEventListener('change', ()=>{
  const file = photoInput.files[0];
  if(!file) return;
  pendingPhoto = file;
  const reader = new FileReader();
  reader.onload = ()=>{
    filePreview.src = reader.result;
    filePreview.style.display = 'block';
    fileDropLabel.textContent = file.name;
  };
  reader.readAsDataURL(file);
});

document.getElementById('modal-save').addEventListener('click', async ()=>{
  const name = document.getElementById('item-name').value.trim();
  if(!pendingPhoto){ fileDropLabel.textContent = 'Add a photo to continue'; return; }
  if(!name){ document.getElementById('item-name').focus(); return; }
  const saveBtn = document.getElementById('modal-save');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
  try{
    const item = await addWardrobeItem({
      file: pendingPhoto, name,
      category: document.getElementById('item-category').value,
      warmth: document.getElementById('item-warmth').value,
      formality: document.getElementById('item-formality').value,
      brand: document.getElementById('item-brand').value.trim(),
      size: document.getElementById('item-size').value.trim(),
      fit: document.getElementById('item-fit').value
    });
    wardrobe.push(item);
    closeModal();
    renderRails();
  }catch(e){
    fileDropLabel.textContent = 'Something went wrong: ' + e.message;
  }
  saveBtn.disabled = false; saveBtn.textContent = 'Add to wardrobe';
});

// ---------------- outfit suggestion ----------------
let lastPickedItems = [];

function pickBest(category, reqWarmth, reqFormality){
  const all = wardrobe.filter(i=>i.category===category);
  if(all.length===0) return {item:null, score:Infinity, allDirty:false};
  const clean = all.filter(i=>!i.isDirty);
  const pool = clean.length > 0 ? clean : all;
  const allDirty = clean.length === 0;
  let best = null, bestScore = Infinity;
  pool.forEach(i=>{
    let score = Math.abs(WARMTH_SCALE[i.warmth]-reqWarmth) + Math.abs(FORMALITY_SCALE[i.formality]-reqFormality);
    score -= ((i.rating || 0) - 3) * 0.15;
    if(score < bestScore){ bestScore = score; best = i; }
  });
  return {item:best, score:bestScore, allDirty};
}

document.getElementById('suggest-btn').addEventListener('click', ()=>{
  const freetext = document.getElementById('freetext').value.trim();
  if(freetext) parseFreeText(freetext);

  const temp = parseInt(tempSlider.value, 10);
  const condition = selectedCondition;
  const occasion = selectedOccasion;

  let reqWarmth;
  if(temp < 40) reqWarmth = 2; else if(temp < 60) reqWarmth = 1; else reqWarmth = 0;
  const needOuterwear = temp < 60 || ['Rain','Snow','Windy'].includes(condition);
  const formalityMap = {Casual:0, Workout:0, 'Date night':1, Work:2, Formal:3};
  const reqFormality = formalityMap[occasion];

  const picks = {};
  const gaps = [];
  const scores = [];
  ['top','bottom','shoes'].forEach(cat=>{
    const {item, score, allDirty} = pickBest(cat, reqWarmth, reqFormality);
    if(item){
      picks[cat] = item; scores.push(Math.max(score,0));
      if(allDirty) gaps.push(`All your ${cat}s are marked dirty — using one anyway, but a load of laundry would help.`);
      else if(score > 3) gaps.push(`Your ${cat} options are a stretch for this vibe — worth adding something closer.`);
    }
    else gaps.push(`Nothing in ${cat}s yet — add a piece so I can complete the look.`);
  });
  if(needOuterwear){
    const {item, score, allDirty} = pickBest('outerwear', reqWarmth, reqFormality);
    if(item){ picks.outerwear = item; scores.push(Math.max(score,0)); if(allDirty) gaps.push(`Your outerwear is all dirty — using it anyway.`); }
    else gaps.push(`It's cold or wet enough for a layer, but you don't have outerwear logged yet.`);
  }
  if(reqFormality >= 2){
    const {item, score} = pickBest('accessory', reqWarmth, reqFormality);
    if(item){ picks.accessory = item; scores.push(Math.max(score,0)); }
  }

  const condLower = condition.toLowerCase();
  let why = `It's ${temp}°F and ${condLower} out, and you're dressing for ${occasion.toLowerCase()}. `;
  const pieces = [];
  if(picks.top) pieces.push(picks.top.name);
  if(picks.bottom) pieces.push(picks.bottom.name);
  if(picks.outerwear) pieces.push(picks.outerwear.name);
  if(picks.shoes) pieces.push(picks.shoes.name);
  if(picks.accessory) pieces.push(picks.accessory.name);

  if(pieces.length){
    why += `Going with the ${pieces.join(', ')}`;
    why += needOuterwear && picks.outerwear ? ` — the layer earns its spot given the ${condLower==='clear'?'temperature':condLower}.` : '.';
  } else {
    why = `It's ${temp}°F and ${condLower} out, dressing for ${occasion.toLowerCase()}, but your wardrobe's empty so far.`;
  }

  lastPickedItems = Object.values(picks);
  const avgScore = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 5;
  const pct = Math.max(0, Math.min(100, Math.round(100 - (avgScore/5)*100)));
  const confEl = document.getElementById('result-confidence');
  confEl.textContent = pct + '% match';
  confEl.className = 'confidence ' + (pct >= 75 ? 'high' : pct >= 45 ? 'mid' : 'low');
  document.getElementById('wore-this-btn').textContent = 'I wore this';
  document.getElementById('wore-this-btn').disabled = lastPickedItems.length === 0;

  document.getElementById('result-reasoning').textContent = why;
  const flatlay = document.getElementById('result-flatlay');
  flatlay.innerHTML = '';
  ['top','bottom','outerwear','shoes','accessory'].forEach(cat=>{
    if(picks[cat]){
      const div = document.createElement('div');
      div.className = 'flatlay-item';
      div.innerHTML = `<img src="${picks[cat].dataUrl}" alt="${picks[cat].name}"><div class="cap">${cat}</div>`;
      flatlay.appendChild(div);
    }
  });
  document.getElementById('result-gaps').innerHTML = gaps.map(g=>`⤷ ${g}`).join('<br>');
  document.getElementById('result-card').style.display = 'block';
  document.getElementById('result-card').scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('wore-this-btn').addEventListener('click', async ()=>{
  if(lastPickedItems.length === 0) return;
  const btn = document.getElementById('wore-this-btn');
  btn.disabled = true; btn.textContent = 'Logging…';
  await logWear(lastPickedItems);
  btn.textContent = 'Logged — these are in the wash now';
});
</script>
